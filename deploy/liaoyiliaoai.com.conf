# ============================================================
#  MirrorU AI / 镜语AI 官网  ——  Nginx 站点配置
#  适用：阿里云轻量应用服务器（宝塔面板）或手动安装的 Nginx
#  网站根目录：/www/wwwroot/liaoyiliaoai.com
#  说明：宝塔添加站点后会自动生成类似配置；本文件供你手动修改/核对用。
# ============================================================

# ---------- 1) HTTP 站点（未配证书前先用这个） ----------
server {
    listen 80;
    listen [::]:80;
    server_name liaoyiliaoai.com www.liaoyiliaoai.com;

    root /www/wwwroot/liaoyiliaoai.com;
    index index.html;

    # 静态资源缓存（css/js/图片）
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 普通页面
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ★ 启用 HTTPS 后，把上面 location / 注释掉，改用下面这行强制跳 HTTPS：
    # return 301 https://liaoyiliaoai.com$request_uri;
}

